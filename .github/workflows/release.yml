name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
            target: ''
          - platform: 'windows-latest'
            args: '--target aarch64-pc-windows-msvc'
            target: 'aarch64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target || '' }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare signing key
        if: env.TAURI_SIGNING_PRIVATE_KEY != '' || secrets.TAURI_SIGNING_PRIVATE_KEY != ''
        run: |
          CLEAN_KEY=$(echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | tr -d '\r\n')
          echo "TAURI_SIGNING_PRIVATE_KEY=${CLEAN_KEY}" >> $GITHUB_ENV

      - name: Build and upload artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Zentauri v__VERSION__'
          releaseBody: 'Automatic release built by GitHub Actions.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  manifest:
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate and upload updater manifest
        run: |
          TAG_NAME="${{ github.ref_name }}"
          CLEAN_VER="${TAG_NAME#v}"

          # Download existing latest.json or .sig files
          gh release download "${TAG_NAME}" --pattern "*.sig" || true
          gh release download "${TAG_NAME}" --pattern "latest.json" || true

          # If latest.json exists and contains a valid signature (starts with R...), preserve it
          if grep -q '"signature": "R' latest.json 2>/dev/null; then
            echo "latest.json already contains valid signatures generated by tauri-action."
            exit 0
          fi

          # Extract signature strings if available
          SIG_DARWIN=$(cat ZenTauri_universal.app.tar.gz.sig 2>/dev/null || cat *.app.tar.gz.sig 2>/dev/null || echo "")
          SIG_WIN_X64=$(cat ZenTauri_${CLEAN_VER}_x64-setup.exe.sig 2>/dev/null || cat *x64-setup.exe.sig 2>/dev/null || echo "")
          SIG_LINUX=$(cat ZenTauri_${CLEAN_VER}_amd64.AppImage.sig 2>/dev/null || cat *.AppImage.sig 2>/dev/null || echo "")

          cat <<EOF > latest.json
          {
            "version": "${TAG_NAME}",
            "notes": "Zentauri ${TAG_NAME} Release",
            "pub_date": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${SIG_DARWIN}",
                "url": "https://github.com/marcodem/zentauri/releases/download/${TAG_NAME}/ZenTauri_universal.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "${SIG_DARWIN}",
                "url": "https://github.com/marcodem/zentauri/releases/download/${TAG_NAME}/ZenTauri_universal.app.tar.gz"
              },
              "windows-x86_64": {
                "signature": "${SIG_WIN_X64}",
                "url": "https://github.com/marcodem/zentauri/releases/download/${TAG_NAME}/ZenTauri_${CLEAN_VER}_x64-setup.exe"
              },
              "linux-x86_64": {
                "signature": "${SIG_LINUX}",
                "url": "https://github.com/marcodem/zentauri/releases/download/${TAG_NAME}/ZenTauri_${CLEAN_VER}_amd64.AppImage"
              }
            }
          }
          EOF
          gh release upload "${TAG_NAME}" latest.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
