name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'ubuntu-24.04-arm'
            args: ''
          - platform: 'windows-latest'
            args: ''
            target: ''
          - platform: 'windows-latest'
            args: '--target aarch64-pc-windows-msvc'
            target: 'aarch64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target || '' }}

      - name: Install Linux dependencies (Ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare signing key
        shell: bash
        run: |
          CLEAN_KEY=$(echo "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | tr -d '\r\n')
          echo "TAURI_SIGNING_PRIVATE_KEY=${CLEAN_KEY}" >> $GITHUB_ENV

      - name: Build and upload artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Zentauri v__VERSION__'
          releaseBody: 'Automatic release built by GitHub Actions.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  manifest:
    needs: release
    if: success()
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate and upload updater manifest
        run: |
          TAG_NAME="${{ github.ref_name }}"
          CLEAN_VER="${TAG_NAME#v}"

          # Download existing latest.json or .sig files
          gh release download "${TAG_NAME}" --pattern "*.sig" || true
          gh release download "${TAG_NAME}" --pattern "latest.json" || true

          # Extract signature strings if available
          SIG_DARWIN=$(cat ZenTauri_universal.app.tar.gz.sig 2>/dev/null || cat *.app.tar.gz.sig 2>/dev/null || echo "")
          SIG_WIN_X64=$(cat ZenTauri_${CLEAN_VER}_x64-setup.exe.sig 2>/dev/null || cat *x64-setup.exe.sig 2>/dev/null || echo "")
          SIG_WIN_ARM64=$(cat ZenTauri_${CLEAN_VER}_arm64-setup.exe.sig 2>/dev/null || cat *arm64-setup.exe.sig 2>/dev/null || echo "")
          SIG_LINUX_X64=$(cat ZenTauri_${CLEAN_VER}_amd64.AppImage.sig 2>/dev/null || cat *amd64.AppImage.sig 2>/dev/null || echo "")

          if [ -z "$SIG_DARWIN" ] || [ -z "$SIG_WIN_X64" ] || [ -z "$SIG_LINUX_X64" ]; then
            echo "Error: Missing required signature files for release manifest."
            exit 1
          fi

          ARM64_SIG_FILE=$(ls ZenTauri_*arm64*.AppImage.sig ZenTauri_*aarch64*.AppImage.sig 2>/dev/null | head -n 1)
          if [ -n "$ARM64_SIG_FILE" ]; then
            ARM64_FILE="${ARM64_SIG_FILE%.sig}"
            SIG_LINUX_ARM64=$(cat "$ARM64_SIG_FILE")
          else
            ARM64_FILE="ZenTauri_${CLEAN_VER}_arm64.AppImage"
            SIG_LINUX_ARM64=""
          fi

          # Extract release notes for current tag
          NODE_NOTES=$(node -e '
            const fs = require("fs");
            const tag = process.argv[1];
            const cleanVer = tag.replace(/^v/, "");
            let text = "";
            try {
              const content = fs.readFileSync("docs/release-notes.md", "utf8");
              const re = new RegExp(`###\\s+ZenTauri\\s+v?${cleanVer}[\\s\\S]*?(?=(?:###\\s+ZenTauri|---\\s*###|$))`, "i");
              const m = content.match(re);
              if (m) {
                text = m[0].replace(/^###[^\n]+\n+/, "").trim();
              }
            } catch(e) {}
            if (!text) {
              try {
                const content = fs.readFileSync("RELEASE_NOTES.md", "utf8");
                const re = new RegExp(`#\\s+Release Notes[^\\n]+v?${cleanVer}[\\s\\S]*?(?=(?:#\\s+Release Notes|---\\s*#|$))`, "i");
                const m = content.match(re);
                if (m) {
                  text = m[0].replace(/^#[^\n]+\n+/, "").trim();
                }
              } catch(e) {}
            }
            if (!text) text = `Zentauri ${tag} Release`;
            process.stdout.write(JSON.stringify(text));
          ' "${TAG_NAME}")

          cat <<EOF > latest.json
          {
            "version": "${TAG_NAME}",
            "notes": ${NODE_NOTES},
            "pub_date": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${SIG_DARWIN}",
                "url": "https://github.com/marcodem/zentauri/releases/download/${TAG_NAME}/ZenTauri_universal.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "${SIG_DARWIN}",
                "url": "https://github.com/marcodem/zentauri/releases/download/${TAG_NAME}/ZenTauri_universal.app.tar.gz"
              },
              "windows-x86_64": {
                "signature": "${SIG_WIN_X64}",
                "url": "https://github.com/marcodem/zentauri/releases/download/${TAG_NAME}/ZenTauri_${CLEAN_VER}_x64-setup.exe"
              },
              "windows-x86_64-nsis": {
                "signature": "${SIG_WIN_X64}",
                "url": "https://github.com/marcodem/zentauri/releases/download/${TAG_NAME}/ZenTauri_${CLEAN_VER}_x64-setup.exe"
              },
              "windows-aarch64": {
                "signature": "${SIG_WIN_ARM64}",
                "url": "https://github.com/marcodem/zentauri/releases/download/${TAG_NAME}/ZenTauri_${CLEAN_VER}_arm64-setup.exe"
              },
              "windows-aarch64-nsis": {
                "signature": "${SIG_WIN_ARM64}",
                "url": "https://github.com/marcodem/zentauri/releases/download/${TAG_NAME}/ZenTauri_${CLEAN_VER}_arm64-setup.exe"
              },
              "linux-x86_64": {
                "signature": "${SIG_LINUX_X64}",
                "url": "https://github.com/marcodem/zentauri/releases/download/${TAG_NAME}/ZenTauri_${CLEAN_VER}_amd64.AppImage"
              },
              "linux-aarch64": {
                "signature": "${SIG_LINUX_ARM64}",
                "url": "https://github.com/marcodem/zentauri/releases/download/${TAG_NAME}/${ARM64_FILE}"
              }
            }
          }
          EOF
          gh release upload "${TAG_NAME}" latest.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
